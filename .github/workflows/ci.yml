name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `cache: npm` here: that option makes this action run the
      # runner's bundled npm to locate the cache directory, and that
      # invocation itself is checked against package.json's `devEngines`
      # (see below) — so it fails before we ever get a chance to upgrade
      # npm. Dependency caching is done explicitly, after the upgrade.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The runner's bundled npm is older than the version this repo's
      # package.json (`devEngines.packageManager`) requires, and npm
      # refuses to run at all under an unmet devEngines constraint
      # (EBADDEVENGINES) — so install the required version first, read
      # from package.json rather than hardcoded so this step can't drift
      # out of sync with it.
      - name: Install required npm version
        run: |
          REQUIRED_NPM=$(node -p "require('./package.json').devEngines.packageManager.version")
          echo "Installing npm@$REQUIRED_NPM (required by package.json devEngines.packageManager)"
          npm install -g "npm@$REQUIRED_NPM"
          npm --version

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, test, build
        run: npx turbo run check-types lint test build --filter=web
        env:
          # Placeholder values so env validation + `next build` pass without
          # secrets. No real database is contacted (public routes are dynamic,
          # and the test suite is pure). Real deploys inject real values.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
